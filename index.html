<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SimiMedi Cooking</title>
<style>:root{--g:#58705f;--p:#f7f2e8;--c:#fffdf8;--i:#29332d;--m:#6d756f;--l:#e4ddd0}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}h1,h2,h3{font-family:Georgia,serif}button,input,textarea,select{font:inherit}button{border:0;border-radius:11px;padding:10px 14px;cursor:pointer}.primary{background:var(--g);color:white}.secondary{background:white;border:1px solid var(--l)}#search{width:100%;padding:14px;border:1px solid var(--l);border-radius:13px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:18px;cursor:pointer}.card .emoji{font-size:55px;text-align:center;padding:20px;background:#e3ebe3;border-radius:13px}.tags{color:var(--g);font-size:13px}.muted{color:var(--m)}dialog{border:0;border-radius:18px;padding:0;width:min(680px,94vw);background:var(--c)}dialog::backdrop{background:#1d282399}.modal{padding:22px}.field{margin:13px 0}.field label{display:block;font-weight:650;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--l);border-radius:9px}.field textarea{min-height:100px}.notice{background:#fff0d7;padding:11px;border-radius:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:16px}}</style></head>
<body><main><header><div><h1 style="margin-bottom:2px">SimiMedi Cooking</h1><span class="muted">Our shared family cookbook</span></div><button id="add" class="primary">＋ Add recipe</button></header><input id="search" placeholder="Search recipes or ingredients…"><div id="status" class="notice">Connecting to your cookbook…</div><section id="grid" class="grid"></section></main>
<dialog id="setup"><form method="dialog" class="modal"><h2>Create your cookbook</h2><p>This happens only once. Save the editing link that appears afterward.</p><button id="create" type="button" class="primary">Create SimiMedi Cooking</button></form></dialog>
<dialog id="editor"><form class="modal" onsubmit="return false"><div class="row"><h2 id="formTitle">Recipe</h2><button type="button" class="secondary" onclick="editor.close()">×</button></div><div class="field"><label>Title</label><input id="title" required></div><div class="row"><div class="field" style="flex:1"><label>Meal</label><select id="meal"><option>Dinner</option><option>Lunch</option><option>Breakfast</option><option>Dessert</option><option>Snack</option></select></div><div class="field" style="flex:1"><label>Time</label><input id="time" placeholder="30 min"></div></div><div class="field"><label>Ingredients — one per line</label><textarea id="ingredients"></textarea></div><div class="field"><label>Instructions — one step per line</label><textarea id="steps"></textarea></div><div class="field"><label>Tags — separated by commas</label><input id="tags"></div><div class="actions"><button id="remove" type="button" class="secondary">Delete</button><button id="save" type="button" class="primary">Save recipe</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
